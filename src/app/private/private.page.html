<ion-header class="ion-hide-sm-up mobile-header" [translucent]="true">
  <ion-toolbar class="mobile-header-inner">
    <ion-row>
      <button class="header-btn" (click)="loadFiles()"><ion-icon name="reload-outline"></ion-icon></button>
      <ion-title class="ion-text-center"> Private Dateien </ion-title>
      <button class="header-btn" (click)="logout()"><ion-icon name="log-out-outline"></ion-icon></button>
    </ion-row>
    
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true">
  <ion-header collapse="condense" class="ion-hide-sm-up mobile-header">
    <ion-toolbar class="mobile-header-inner">
      <ion-title class="ion-text-center" size="large"
        >Private Dateien</ion-title
      >
    </ion-toolbar>
  </ion-header>

  <div class="body">
    <div class="ion-hide-sm-down">
      <h2>Private Dateien</h2>
      <sub>Pfad: </sub>
    </div>
    <hr />
    <div class="file-container">
      @for(file of files$ | async; track file) {
      <cmp-file-list-item
        [file-data]="file"
        (itemClicked)="listItemSelected($event)"
      ></cmp-file-list-item>
      }
    </div>
  </div>

  @if(showPopup){
  <page-file-popup
    [file-data]="selectedFile"
    [download-type]="'file'"
    (hidePopup)="hidePopup()"
  ></page-file-popup>
  }
</ion-content>
