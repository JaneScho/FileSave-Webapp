<ion-header [translucent]="true">
  <ion-toolbar>
    <ion-title>
      Dateisuche
    </ion-title>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true">
  <ion-header collapse="condense">
    <ion-toolbar>
      <ion-title size="large">Dateisuche</ion-title>
    </ion-toolbar>
  </ion-header>

  <ion-searchbar placeholder="Tag"></ion-searchbar>

  <!--placeholder-->
<ion-list>
  @for(file of files$ | async; track file)
  {
    <ion-item>
      <ion-label>
        <h2>{{file.filename}}</h2>
        <div class="tags">
          @for (tag of file.tags; track tag) {
          <ion-chip color="primary" outline="true">
              <ion-label>{{tag}}</ion-label>
            </ion-chip>
          }
        </div>
      </ion-label>

      <ion-button slot="end" fill="clear" color="medium">
        mehr
      </ion-button>

    </ion-item>
  }
</ion-list>
