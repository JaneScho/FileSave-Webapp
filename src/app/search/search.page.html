<ion-header class="ion-hide-sm-up mobile-header" [translucent]="true">
  <ion-toolbar class="mobile-header-inner">
    <ion-row>
      <ion-title class="ion-text-center"> Dateisuche mit Tags </ion-title>
      <button class="header-btn" (click)="logout()">
        <ion-icon name="log-out-outline"></ion-icon>
      </button>
    </ion-row>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true" [scrollY]="!showPopup">
  <ion-header collapse="condense" class="ion-hide-sm-up mobile-header">
    <ion-toolbar class="mobile-header-inner">
    <ion-row>
      <ion-title class="ion-text-center"> Dateisuche mit Tags </ion-title>
      <button class="header-btn" (click)="logout()">
        <ion-icon name="log-out-outline"></ion-icon>
      </button>
    </ion-row>
  </ion-toolbar>
  </ion-header>

  <div class="body">
    <ion-row class="wide-header ion-hide-sm-down ion-justify-content-between">
      <div class="wide-title-box">
        <h2>Suche</h2>
      </div>

      <div class="header-btn-container">
        <button class="wide-title-button" (click)="logout()"><ion-icon name="log-out-outline" class="fs-4"></ion-icon></button>
      </div>
    
    </ion-row>

    <hr />

    <!--Suchleiste-->
    <div class="search-section ion-padding-horizontal">
      <ion-searchbar 
        placeholder="Suche basierend auf Tag..." 
        [(ngModel)]="searchTag"
        (keyup.enter)="triggerSearch()"
        [debounce]="500">
      </ion-searchbar>
    </div>

    <!--Dateianzeige-->
    <div class="file-container"> 
      @for(file of files$ | async; track file) {
      <cmp-search-list-item
        [file-data]="file"
        (itemClicked)="listItemSelected($event)"
      ></cmp-search-list-item>
      }
    </div>
  </div>

  @if(showPopup){
  <cmp-search-list-item-overview
    [file-data]="selectedFile"
    (hidePopup)="hidePopup()"
  ></cmp-search-list-item-overview>
  }
</ion-content>
