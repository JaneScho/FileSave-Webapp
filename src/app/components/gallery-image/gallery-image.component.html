<div class="ion-text-center">
  @if(fileData && fileData.filename.length > 0){
    @if(isLoading){
      <ion-spinner name="crescent"></ion-spinner>
    }
    @else{
      <ion-img [src]="imageSrc" (ionError)="imageLoadErr()"></ion-img>
    }
    {{fileData.filename}}
    <ion-row>
      @for(tag of fileData.tags;track $index){
        <label class="tag">{{tag}}</label>
      }
    </ion-row>
  }
</div>
