<div class="pos-relative">
<ion-searchbar [ngModel]="searchTerm" (ionInput)="onSearch($event)" placeholder="Suche..."></ion-searchbar>
@if (filteredItems.length > 0) {
  <ion-list>
    @for (item of filteredItems;track $index) {
      <ion-item-option (click)="selectItem(item)">
        {{ item }}
      </ion-item-option>
      <hr>
    }
  </ion-list>
}
</div>
