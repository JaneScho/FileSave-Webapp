<ion-row class="my-3 list-item ion-align-items-center" (click)="emitItemClicked()">
  <ion-icon name="document-outline" class="fs-4 center-vertical"></ion-icon>
  <span class="ms-1 item-label">{{fileData.filename}}</span>
  @for(tag of fileData.tags; track $index){
    <label class="tag">{{tag}}</label>
  }
</ion-row>
